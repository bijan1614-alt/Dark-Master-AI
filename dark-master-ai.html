<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#181825">
<title>Dark Master AI</title>
<style>
body{margin:0;font-family:sans-serif;background:#1e1e2e;color:#eee;display:flex;flex-direction:column;height:100dvh}
h1{margin:0;padding:14px;font-size:18px;background:#181825;text-align:center}
#keybtn{cursor:pointer;margin-left:8px}
#chat{flex:1;overflow-y:auto;padding:16px}
.msg{max-width:85%;padding:10px 14px;margin:8px 0;border-radius:12px;white-space:pre-wrap;line-height:1.5}
.user{background:#4c6ef5;margin-left:auto}
.ai{background:#313244}
#bar{display:flex;gap:8px;padding:12px;background:#181825}
#box{flex:1;padding:12px;border-radius:8px;border:none;font-size:16px}
button{padding:12px 20px;border:none;border-radius:8px;background:#4c6ef5;color:#fff;font-size:16px}
</style>
</head>
<body>
<h1>Dark Master AI <span id="keybtn" title="key বদলান">🔑</span></h1>
<div id="chat"></div>
<div id="bar">
<input id="box" placeholder="এখানে লিখুন...">
<button id="send">পাঠান</button>
</div>
<script>
const BASE = "https://generativelanguage.googleapis.com/v1beta/";
const MODEL = "gemini-3.8-flash";
const chat = document.getElementById("chat");
const box = document.getElementById("box");
let history = [];

function getKey() {
  let k = localStorage.getItem("gkey");
  if (!k) {
    k = prompt("আপনার Gemini API key দিন:");
    if (k) localStorage.setItem("gkey", k.trim());
  }
  return k ? k.trim() : null;
}

function add(cls, text) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

const sleep = ms => new Promise(r => setTimeout(r, ms));
const RETRY = [503, 429, 500, 0];

async function call(model, contents, key) {
  try {
    const r = await fetch(
      BASE + "models/" + model + ":generateContent?key=" + encodeURIComponent(key),
      {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({contents})
      }
    );
    const d = await r.json();
    if (r.ok) {
      const parts = (d.candidates && d.candidates[0] && d.candidates[0].content.parts) || [];
      const t = parts.map(p => p.text || "").join("");
      return {s: 200, t: t || "(খালি উত্তর এসেছে)"};
    }
    return {s: r.status, t: JSON.stringify(d).slice(0, 300)};
  } catch (e) {
    return {s: 0, t: String(e)};
  }
}

async function otherModels(key) {
  try {
    const r = await fetch(BASE + "models?pageSize=100&key=" + encodeURIComponent(key));
    const d = await r.json();
    const bad = ["image", "tts", "live", "audio", "embed", "robotics"];
    return (d.models || [])
      .filter(m => (m.supportedGenerationMethods || []).includes("generateContent")
        && m.name.includes("flash")
        && !bad.some(b => m.name.includes(b)))
      .map(m => m.name.replace("models/", ""))
      .filter(n => n !== MODEL)
      .sort().reverse().slice(0, 3);
  } catch (e) {
    return [];
  }
}

async function ask(contents, key) {
  let last = {s: 0, t: "অজানা ত্রুটি"};
  let models = [MODEL];
  for (let i = 0; i < models.length; i++) {
    for (let a = 0; a < 2; a++) {
      const res = await call(models[i], contents, key);
      if (res.s === 200) return res;
      last = res;
      if (RETRY.includes(res.s)) { await sleep(2000); continue; }
      break;
    }
    if (last.s === 400 || last.s === 403) break;
    if (i === 0) models = models.concat(await otherModels(key));
  }
  return last;
}

async function send() {
  const text = box.value.trim();
  if (!text) return;
  const key = getKey();
  if (!key) return;
  box.value = "";
  add("user", text);
  history.push({role: "user", parts: [{text}]});
  const out = add("ai", "ভাবছি...");
  const res = await ask(history, key);
  if (res.s === 200) {
    out.textContent = res.t;
    history.push({role: "model", parts: [{text: res.t}]});
  } else {
    out.textContent = "ত্রুটি: " + res.s + " " + res.t;
    history.pop();
    if (res.s === 400 || res.s === 403) localStorage.removeItem("gkey");
  }
  chat.scrollTop = chat.scrollHeight;
}

document.getElementById("send").onclick = send;
box.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
document.getElementById("keybtn").onclick = () => {
  localStorage.removeItem("gkey");
  getKey();
};
</script>
</body>
</html>
